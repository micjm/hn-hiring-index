name: Refresh index and deploy

# Rebuilds data/, plots/ and docs/ from the HN APIs, commits the result back to
# main (so the cached thread counts survive between runs), and publishes the
# site through GitHub Pages.
on:
  schedule:
    - cron: "17 13 * * *" # daily, 13:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "package.json"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild data, plots and index
        run: npm run build

      - name: Build static site
        run: npm run build:static

      # Pushes made with GITHUB_TOKEN do not trigger another workflow run, so this
      # cannot loop. Keeping the refreshed data on main also keeps the 30-day
      # thread cache (data/posts.json) warm for the next run.
      - name: Commit refreshed data
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data plots docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Refresh index data ($(date -u +%Y-%m-%d))"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
